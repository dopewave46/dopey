# Render Blueprint for the DopeOrca OS backend.
# New → Blueprint → point at this repo. Fill the secret values in the dashboard
# (they are marked sync: false and are NOT stored in git).
#
# This file only takes effect for a Blueprint deployment. If the service was
# created from the dashboard ("New → Web Service"), set its Build Command to the
# same `buildCommand` value below, and its Start / Pre-Deploy / Health-Check to
# match — otherwise this file is ignored.
#
# See ../DEPLOYMENT.md for the full walkthrough, including the managed Postgres
# and the frontend.
services:
  - type: web
    name: dopeorca-os-api
    runtime: node
    rootDir: server
    plan: free
    # `npm ci` does a clean install straight from package-lock.json every build,
    # so a stale build cache can never leave a dependency (e.g. typescript)
    # missing. typescript + @types/* are in "dependencies", so they install even
    # with NODE_ENV=production.
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate:prod
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: LOG_LEVEL
        value: info
      - key: SESSION_TTL_HOURS
        value: 168
      - key: USE_EMBEDDED_PG
        value: "false"
      - key: NOTIFICATIONS_INTERVAL_MINUTES
        value: 60
      - key: RENEWAL_LEAD_DAYS
        value: 30
      - key: DEADLINE_LEAD_DAYS
        value: 5
      # --- set these in the Render dashboard (never commit real values) ---
      - key: SESSION_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
